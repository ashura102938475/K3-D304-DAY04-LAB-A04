# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi câu hỏi cho người dùng. Dùng khi thiếu thông tin bắt buộc (screenname, URL) với response_type='text', HOẶC khi cần xin người dùng xác nhận trước khi thực hiện hành động gửi/đăng bài với response_type='yes_no'."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi gửi người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' khi thiếu thông tin, 'yes_no' khi cần xác nhận hành động"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của MỘT tài khoản cụ thể. Tham số screenname là Twitter handle chính thức dạng chữ thường không có khoảng trắng (ví dụ: elonmusk, sama, karpathy)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter handle viết thường không dấu cách (ví dụ: elonmusk, sama, karpathy)"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng, thảo luận trên mạng xã hội Twitter/X theo từ khóa. Chọn search_type='Top' khi tìm bài đăng phổ biến/nổi bật, 'Latest' cho bài đăng mới nhất."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm trên Twitter"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: 'Top' cho bài đăng phổ biến/nổi bật, 'Latest' cho mới nhất"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin và tin tức thời sự trên Web. Nếu hỏi về tin tức (tin tức AI, tin công nghệ), bắt buộc đặt topic='news'. Trích xuất các từ chỉ thời gian ('hôm nay' -> day, 'tuần này' -> week) vào parameter timeframe và loại bỏ từ thời gian đó khỏi query."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề tìm kiếm (không chứa các từ chỉ thời gian như 'hôm nay', 'tuần này')"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại: chọn 'news' cho tin tức/thời sự, 'general' cho thông tin chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'day' cho hôm nay, 'week' cho tuần này, 'month' cho tháng này"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung chi tiết từ một địa chỉ URL cụ thể."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL cụ thể"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản/bản tin. Yêu cầu phải xin xác nhận từ người dùng bằng tool clarify(response_type='yes_no') trước khi gọi tool này."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung tin nhắn"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]