# starter_v0 — tool declarations with clear routing rules.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng. Dùng response_type='yes_no' trước mọi yêu cầu gửi, đăng hoặc xuất bản ra bên ngoài, kể cả khi nội dung còn thiếu. Với các yêu cầu không có side effect, dùng response_type='text' khi thiếu thông tin bắt buộc như Twitter handle hoặc URL."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter. screenname là canonical handle, không phải display name hay handle tự suy diễn; phải sao chép đúng mapping đã biết."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Canonical handle không có @: Sam Altman=sama, Elon Musk=elonmusk, Andrej Karpathy=karpathy. Dùng chính xác các giá trị này khi tên tương ứng xuất hiện."}
        limit: {type: integer, default: 5, description: "Số lượng tweet"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng theo chủ đề trên mạng xã hội Twitter/X. Vẫn phải gọi tool này trong cùng lượt với các tool nguồn khác khi người dùng yêu cầu cả thảo luận xã hội và nguồn web, tin tức hoặc nghiên cứu."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp (Top cho phổ biến/top)"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên web. Khi tìm tin tức (news), gán topic='news', lọc query chỉ giữ từ khóa chính (không chứa từ 'news'/'hôm nay'), và gán timeframe='day' cho hôm nay hoặc timeframe='week' cho tuần này. Nếu cùng yêu cầu còn đòi hỏi bài đăng hoặc thảo luận mạng xã hội, gọi thêm social_search trong chính lượt đó."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn từ khóa cốt lõi"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại (news cho tin tức)"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian (day=hôm nay, week=tuần này)"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query, topic, timeframe]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ URL cụ thể."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL"}
      required: [url]

  # ---------------- Custom tools ----------------
  - name: github_search
    description: "Tìm các kho lưu trữ mã nguồn mở (repository/projects/libraries) trên GitHub."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm repo/mã nguồn"}
        language: {type: string, default: "", description: "Ngôn ngữ lập trình (ví dụ: python, typescript)"}
        sort: {type: string, enum: [stars, forks, updated], default: "stars", description: "Tiêu chí sắp xếp"}
        limit: {type: integer, default: 5, description: "Số kết quả tối đa"}
      required: [query]

  # ---------------- Extension tool used by team eval ----------------
  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]
