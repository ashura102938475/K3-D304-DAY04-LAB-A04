tools:
  - name: clarify
    description: "Ask the user one short follow-up question when required information is missing, ambiguous, or a yes/no confirmation is required before a side-effect."
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "The exact question to ask the user."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: text
          description: "Use text for missing arguments, yes_no before send/post/publish actions, choice for a small option set."
        options:
          type: array
          default: []
          items:
            type: string
          description: "Choices when response_type is choice."
      required: [question]

  - name: timeline
    description: "Fetch recent posts from one specific social account. Use only when the account or public figure is known. screenname is a handle without @, for example sama, elonmusk, karpathy."
    parameters:
      type: object
      properties:
        screenname:
          type: string
          default: ""
          description: "Account handle without @. Do not use a display name when a known handle is available."
        limit:
          type: integer
          default: 5
          description: "Number of recent posts requested by the user."
      required: [screenname]

  - name: social_search
    description: "Search social posts by topic, keyword, company, model, or event. Use together with lookup when the user asks for both web/news and social posts."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Core social search topic, e.g. AI, OpenAI, GPT-5."
        search_type:
          type: string
          enum: [Latest, Top]
          default: Latest
          description: "Use Top for popular/top posts; otherwise use Latest."
        limit:
          type: integer
          default: 5
          description: "Number of posts to return."
      required: [query]

  - name: lookup
    description: "Search the web for current information or news. For news requests set topic=news and encode time words with timeframe; keep query to the core subject only."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Core subject only, e.g. AI, robotics, OpenAI. Do not append 'news', 'today', or 'this week'."
        topic:
          type: string
          enum: [general, news]
          default: general
          description: "Use news for news/current-events requests."
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: week
          description: "day=today, week=this week, month=this month, year=this year."
        max_results:
          type: integer
          default: 5
          description: "Maximum web results to return."
      required: [query]

  - name: fetch
    description: "Read and extract content from a concrete URL supplied by the user. Do not invent URLs."
    parameters:
      type: object
      properties:
        url:
          type: string
          default: ""
          description: "The exact URL from the user or previous context."
      required: [url]

  - name: format
    description: "Format already-collected items into a digest. Use only after items are available from tool results or user-provided data."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items to format."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template:
          type: string
          enum: [brief, sections, bullets, thread, daily_ai_vn]
          default: sections
          description: "Output style."
        headline:
          type: string
          default: ""
          description: "Optional digest headline."
      required: [items, template]

  - name: send
    description: "Send text to the configured Telegram channel. This has a side effect; call only after explicit user confirmation of the exact text, otherwise ask clarify with response_type=yes_no."
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: "Text to send after confirmation."
        confirmed:
          type: boolean
          default: false
          description: "Must be true only after explicit user confirmation."
      required: [text]

  - name: policy
    description: "Search local company policy markdown files. Use for internal policy questions, privacy, source citation, tool usage, AI research, or external publishing rules."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Policy search query."
        policy_area:
          type: string
          enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage]
          default: all
          description: "Policy category."
        top_k:
          type: integer
          default: 3
          description: "Number of policy snippets."
      required: [query]

  - name: papers
    description: "Search arXiv papers by topic. Use for scientific paper discovery, not general web news."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Paper search query."
        max_results:
          type: integer
          default: 5
          description: "Number of papers."
        sort_by:
          type: string
          enum: [relevance, lastUpdatedDate, submittedDate]
          default: relevance
          description: "Sort order."
      required: [query]

  - name: paper_text
    description: "Extract text from an arXiv paper PDF when the user provides an arXiv ID or URL."
    parameters:
      type: object
      properties:
        arxiv_url:
          type: string
          default: ""
          description: "arXiv ID or URL."
        max_pages:
          type: integer
          default: 5
          description: "Maximum pages to extract."
        max_chars:
          type: integer
          default: 8000
          description: "Maximum extracted characters."
      required: [arxiv_url]
