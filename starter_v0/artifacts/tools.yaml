# Research Agent tool declarations with explicit routing boundaries.
tools:
  - name: clarify
    description: "Ask the user one concise question when required information is missing, or ask for yes/no confirmation before any send/post/publish action. Send/post/publish requests must use response_type yes_no even when the message content is vague."
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "The clarification or confirmation question."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: "Use text for missing details, yes_no for send/post/publish confirmation, and choice only when options are listed."
        options:
          type: array
          default: []
          items:
            type: string
          description: "Choices when response_type is choice."
      required: [question]

  - name: timeline
    description: "Get recent posts from a specific Twitter/X account. Use only when a person/account is identified. Known handles: Sam Altman=sama, Elon Musk=elonmusk, Andrej Karpathy=karpathy. If the user asks for latest tweets/posts but gives no account/person, ask clarify; do not default to AI and do not use social_search."
    parameters:
      type: object
      properties:
        screenname:
          type: string
          default: ""
          description: "Twitter/X handle without @, for example sama, elonmusk, karpathy."
        limit:
          type: integer
          default: 5
          description: "Number of posts requested by the user; default 5."
      required: [screenname]

  - name: social_search
    description: "Search Twitter/X posts by topic, not by a specific account. Use Top only for top/popular/viral requests; otherwise use Latest. Do not use if the latest user turn says to drop Twitter/X or switch to web/news."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Core topic to search, for example OpenAI or GPT-5."
        search_type:
          type: string
          enum: [Latest, Top]
          default: "Latest"
          description: "Latest for recent posts, Top for top/popular/viral posts."
        limit:
          type: integer
          default: 5
          description: "Number of posts to return."
      required: [query]

  - name: lookup
    description: "Search the web. Use topic=news for news/current-events requests. Map today to timeframe=day and this week to timeframe=week. Keep query as the core topic, e.g. AI instead of AI news."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Core search topic, without adding words like news unless the topic itself includes them."
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: "Use news for current news requests; otherwise general."
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: "day for today, week for this week, month/year when explicitly requested."
        max_results:
          type: integer
          default: 5
          description: "Number of web results."
      required: [query]

  - name: fetch
    description: "Read the content of a concrete URL supplied by the user. If no URL is present, ask clarify instead of inventing one."
    parameters:
      type: object
      properties:
        url:
          type: string
          default: ""
          description: "The exact URL provided by the user."
      required: [url]

  - name: format
    description: "Format already available items into a digest or summary. Do not use for fetching new information."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items already available from prior tool results or user input."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template:
          type: string
          enum: [brief, sections, bullets, thread, daily_ai_vn]
          default: "sections"
          description: "Output structure."
        headline:
          type: string
          default: ""
          description: "Optional headline."
      required: [items, template]

  - name: github_search
    description: "Search GitHub repositories, open-source projects, libraries, or codebases. Use only for repository/codebase discovery requests."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Repository search keywords."
        language:
          type: string
          default: ""
          description: "Programming language filter, for example python or typescript."
        sort:
          type: string
          enum: [stars, forks, updated]
          default: "stars"
          description: "Sort criterion."
        limit:
          type: integer
          default: 5
          description: "Maximum number of results."
      required: [query]

  - name: send
    description: "Send text externally. Use only after explicit yes/no user confirmation for the exact send/post/publish action."
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: "Text to send."
        confirmed:
          type: boolean
          default: false
          description: "True only after explicit user confirmation."
      required: [text]

  - name: policy
    description: "Search internal policy documents. Use only for explicit internal policy, citation, privacy, publishing, or tool-usage questions."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Policy search query."
        policy_area:
          type: string
          enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage]
          default: "all"
          description: "Policy area to search."
        top_k:
          type: integer
          default: 3
          description: "Number of policy snippets."
      required: [query]

  - name: papers
    description: "Search scientific papers or academic publications. Use for research literature, arXiv, scholarly, or paper-discovery requests."
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Paper search keywords."
        max_results:
          type: integer
          default: 5
          description: "Maximum number of papers."
        sort_by:
          type: string
          enum: [relevance, lastUpdatedDate, submittedDate]
          default: "relevance"
          description: "Sort criterion."
      required: [query]

  - name: paper_text
    description: "Read text from a concrete arXiv paper URL or ID. If no arXiv URL/ID is present, ask clarify instead of inventing one."
    parameters:
      type: object
      properties:
        arxiv_url:
          type: string
          default: ""
          description: "arXiv URL or ID."
        max_pages:
          type: integer
          default: 5
          description: "Maximum pages to read."
        max_chars:
          type: integer
          default: 8000
          description: "Maximum characters to return."
      required: [arxiv_url]
